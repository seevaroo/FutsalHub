<svg viewBox="0 0 720 330" xmlns="http://www.w3.org/2000/svg" style="background:#f8fafc; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
    <defs>
        <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1 L 10 5 L 0 9 z" fill="#0f172a" />
        </marker>
        <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1 L 10 5 L 0 9 z" fill="#10b981" />
        </marker>
        <marker id="arrow-rose" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1 L 10 5 L 0 9 z" fill="#e11d48" />
        </marker>
    </defs>

    <!-- Background Card -->
    <rect width="100%" height="100%" fill="#f8fafc" rx="12"/>

    <!-- Step 1: Catalog -->
    <rect x="15" y="30" width="115" height="38" rx="8" fill="#f1f5f9" stroke="#0f172a" stroke-width="1.5" />
    <text x="72" y="47" fill="#0f172a" font-size="9" font-weight="700" text-anchor="middle">Buka Katalog</text>
    <text x="72" y="60" fill="#64748b" font-size="7.5" text-anchor="middle">Pilih Jenis Lantai</text>

    <line x1="130" y1="49" x2="165" y2="49" stroke="#0f172a" stroke-width="1.5" marker-end="url(#arrow)" />

    <!-- Step 2: Slot Selection -->
    <rect x="170" y="30" width="125" height="38" rx="8" fill="#ffffff" stroke="#0284c7" stroke-width="1.5" />
    <text x="232" y="46" fill="#0369a1" font-size="9" font-weight="700" text-anchor="middle">Pilih Tgl &amp; Multi-Slot</text>
    <text x="232" y="59" fill="#0284c7" font-size="7.5" text-anchor="middle">Cek Bentrok Real-time</text>

    <line x1="295" y1="49" x2="335" y2="49" stroke="#0f172a" stroke-width="1.5" marker-end="url(#arrow)" />

    <!-- Step 3: Checkout Page -->
    <rect x="340" y="28" width="110" height="42" rx="8" fill="#f8fafc" stroke="#0f172a" stroke-width="1.5" />
    <text x="395" y="45" fill="#0f172a" font-size="9" font-weight="700" text-anchor="middle">Halaman Checkout</text>
    <text x="395" y="59" fill="#64748b" font-size="7.5" text-anchor="middle">Rincian Total Biaya</text>

    <line x1="450" y1="49" x2="495" y2="49" stroke="#0f172a" stroke-width="1.5" marker-end="url(#arrow)" />

    <!-- Step 4: Decision Payment Method -->
    <polygon points="560,25 625,49 560,73 495,49" fill="#fef3c7" stroke="#d97706" stroke-width="1.5" />
    <text x="560" y="47" fill="#92400e" font-size="8.5" font-weight="700" text-anchor="middle">Metode Bayar?</text>
    <text x="560" y="58" fill="#92400e" font-size="7.5" text-anchor="middle">QRIS / Cash</text>

    <!-- Branch 1: QRIS (Right/Down) -->
    <line x1="560" y1="73" x2="560" y2="105" stroke="#0284c7" stroke-width="1.5" marker-end="url(#arrow)" />
    <text x="568" y="92" fill="#0284c7" font-size="8" font-weight="700">QRIS Transfer</text>

    <!-- Box QRIS Process -->
    <rect x="495" y="110" width="130" height="45" rx="8" fill="#f0f9ff" stroke="#0284c7" stroke-width="1.5" />
    <text x="560" y="126" fill="#0369a1" font-size="8.5" font-weight="700" text-anchor="middle">Scan QR &amp; Upload Bukti</text>
    <text x="560" y="141" fill="#0284c7" font-size="7.5" text-anchor="middle">Status: Pending Verifikasi</text>

    <!-- Branch 2: Cash (Far Right/Down) -->
    <line x1="625" y1="49" x2="685" y2="49" stroke="#10b981" stroke-width="1.5" />
    <line x1="685" y1="49" x2="685" y2="105" stroke="#10b981" stroke-width="1.5" marker-end="url(#arrow-green)" />
    <text x="645" y="42" fill="#059669" font-size="8" font-weight="700">Cash di Kasir</text>

    <!-- Box Cash Process -->
    <rect x="635" y="110" width="80" height="45" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5" />
    <text x="675" y="126" fill="#065f46" font-size="8" font-weight="700" text-anchor="middle">Booking Cash</text>
    <text x="675" y="141" fill="#059669" font-size="7" text-anchor="middle">Bayar di Tempat</text>

    <!-- Lines to Admin Action -->
    <line x1="560" y1="155" x2="560" y2="190" stroke="#0f172a" stroke-width="1.5" marker-end="url(#arrow)" />
    <line x1="675" y1="155" x2="675" y2="175" stroke="#0f172a" stroke-width="1.5" />
    <line x1="675" y1="175" x2="560" y2="175" stroke="#0f172a" stroke-width="1.5" />

    <!-- Step 5: Admin Action Decision -->
    <polygon points="560,195 635,225 560,255 485,225" fill="#f1f5f9" stroke="#0f172a" stroke-width="1.5" />
    <text x="560" y="222" fill="#0f172a" font-size="8.5" font-weight="700" text-anchor="middle">Tindakan Admin</text>
    <text x="560" y="233" fill="#64748b" font-size="7.5" text-anchor="middle">(Verifikasi Kasir)</text>

    <!-- Action Approved / Completed -> Left to Success -->
    <line x1="485" y1="225" x2="330" y2="225" stroke="#10b981" stroke-width="2" marker-end="url(#arrow-green)" />
    <text x="390" y="217" fill="#10b981" font-size="8.5" font-weight="700">Setujui / Konfirmasi Cash</text>

    <!-- Success Box -->
    <rect x="180" y="202" width="145" height="46" rx="10" fill="#dcfce7" stroke="#10b981" stroke-width="1.5" />
    <text x="252" y="221" fill="#166534" font-size="9.5" font-weight="800" text-anchor="middle">Booking Terkonfirmasi</text>
    <text x="252" y="237" fill="#15803d" font-size="8" text-anchor="middle">Invoice &amp; Kode Tiket Aktif</text>

    <!-- Action Rejected / Cancelled -> Down to Cancelled -->
    <line x1="560" y1="255" x2="560" y2="285" stroke="#e11d48" stroke-width="1.5" marker-end="url(#arrow-rose)" />
    <text x="568" y="272" fill="#e11d48" font-size="8" font-weight="700">Tolak / Batalkan</text>

    <!-- Cancelled Box -->
    <rect x="495" y="287" width="130" height="34" rx="8" fill="#ffe4e6" stroke="#e11d48" stroke-width="1.5" />
    <text x="560" y="303" fill="#9f1239" font-size="8.5" font-weight="700" text-anchor="middle">Booking Dibatalkan</text>
    <text x="560" y="315" fill="#be123c" font-size="7" text-anchor="middle">Slot Dilepas Kembali</text>
</svg>
